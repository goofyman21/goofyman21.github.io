<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Meridian is offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #07080c; color: #f6f3ee; }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: Georgia, "Times New Roman", serif;
      }
      main { max-width: 28rem; text-align: center; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 20px;
        background: #12151c url("/icons/icon-192.png") center/cover no-repeat;
      }
      h1 { font-weight: 400; font-style: italic; font-size: 3rem; margin: 0; letter-spacing: -0.03em; }
      p { font-family: system-ui, sans-serif; color: #c8c1b6; line-height: 1.6; }
      a {
        display: inline-flex; margin-top: 8px; color: #07080c; background: #f6f3ee;
        text-decoration: none; border-radius: 999px; padding: 12px 18px;
        font-family: system-ui, sans-serif; font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Meridian</h1>
      <p>You are offline. The last book you opened is saved on this device once it has loaded online.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
